name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Cancel stale PR pushes for fast feedback, but never cancel a `main` build —
    # reviewers always need a definitive pass/fail signal on the trunk.
    concurrency:
      group: ci-static-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Check requirements.txt
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-project --format requirements-txt --output-file requirements.txt
          git diff --exit-code requirements.txt

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy (strict, src/gander)
        run: uv run mypy src/

      - name: Pytest (deterministic)
        run: uv run pytest -m "not live and not e2e" --strict-markers -v

  openrouter-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: static
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The acceptance suite touches DDG, so serialize main-branch runs.
    concurrency:
      group: ci-live
      cancel-in-progress: false
    steps:
      - name: Require OpenRouter secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: test -n "$OPENROUTER_API_KEY"

      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Pytest (OpenRouter live)
        env:
          GANDER_LLM_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Exercise the production OpenRouter path end to end: PDF pages use
          # OpenRouter vision, DOCX stays deterministic, and downstream stages
          # use OpenRouter text/JSON.
          GANDER_PDF_INGEST_MODE: vision
          GANDER_DOCX_INGEST_MODE: text
        # --reruns 1 absorbs transient DDG-search + LLM-sampling variance on the
        # per-test live assertions (salary search, anchor-survival), where a retry
        # genuinely re-issues the flaky call (cross-fixture flake ~50% -> ~10%).
        # It does NOT rescue the documented growth-JSON truncation flaky: that
        # degrades the growth stage to a StageFailure cached in the session-scoped
        # `triplet` fixture, so a per-test rerun re-reads the same failed Report
        # (see tasks/backlog.md `prod-readiness-p1-live-flaky`, commit a418db3 —
        # durable fix tracked there). Kept until a measured live flake rate
        # justifies removal; live only — fast/slow suites stay deterministic.
        #
        # -n 4 --dist=loadgroup parallelizes the I/O-bound async tests
        # (LLM HTTPS dominates wall time). The DDG-touching salary test carries
        # @pytest.mark.xdist_group("ddg") so loadgroup pins it to a single worker.
        run: uv run pytest -m live --strict-markers --reruns 1 --reruns-delay 2 -n 4 --dist=loadgroup -v

  # Deploy is the last step of CI: the HF Space only receives commits that passed
  # both static and the live acceptance suite. Skipped (not failed) on PRs.
  # Manual re-sync without CI: workflow_dispatch on sync-to-hub.yml.
  sync:
    needs: [static, openrouter-live]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/sync-to-hub.yml
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
