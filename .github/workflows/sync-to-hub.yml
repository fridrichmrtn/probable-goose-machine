name: Sync to Hugging Face Space

on:
  # Called as the final job of ci.yml — deploys only after static + openrouter-live pass.
  workflow_call:
    secrets:
      HF_TOKEN:
        required: true
  # Manual escape hatch for triage. Bypasses CI gating — use only when you know
  # the current main is good (e.g. re-syncing after an HF-side hiccup).
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_SPACE_ID: ${{ vars.HF_SPACE_ID || 'fridrichmrtn/probable-goose-machine' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    # 5 min for checkout+push, plus up to ~5 min of health-check polling below.
    timeout-minutes: 10
    # Single global queue — never race two pushes to the same HF remote.
    # `cancel-in-progress: false` lets in-flight pushes finish; the newer push queues behind.
    concurrency:
      group: sync-to-hub
      cancel-in-progress: false
    steps:
      - name: Checkout (full history + LFS)
        uses: actions/checkout@v6
        with:
          # HF rejects shallow pushes as non-fast-forward; we need the full graph.
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # `x-access-token` is HF's documented user for token-auth pushes.
        # No `--force` — pushes must be fast-forward. A non-FF rejection is a real divergence
        # (e.g. someone direct-pushed to `hf` while CI ran) and should fail loudly for triage.
        run: |
          git push "https://x-access-token:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}" main

      - name: Wait for deployed revision
        run: |
          runtime_url="https://huggingface.co/api/spaces/${HF_SPACE_ID}/runtime"
          app_url="https://${HF_SPACE_ID/\//-}.hf.space"
          deadline=$((SECONDS + 300))
          stage=UNKNOWN
          runtime_sha=unknown

          while (( SECONDS < deadline )); do
            if runtime="$(curl --connect-timeout 3 --max-time 5 -fsS "$runtime_url")"; then
              stage="$(jq -r '.stage // "UNKNOWN"' <<< "$runtime")"
              runtime_sha="$(jq -r '.sha // "unknown"' <<< "$runtime")"
              echo "Space stage=$stage sha=$runtime_sha (expected $GITHUB_SHA)."

              if [[ "$runtime_sha" == "$GITHUB_SHA" ]]; then
                case "$stage" in
                  RUNNING)
                    if curl --connect-timeout 3 --max-time 10 -fsS \
                      "$app_url/config" > /dev/null; then
                      echo "Space is serving $GITHUB_SHA at $app_url."
                      exit 0
                    fi
                    echo "Space is running but $app_url/config is not healthy yet."
                    ;;
                  STOPPED)
                    echo "Space is asleep; requesting $app_url/config to wake it."
                    curl --connect-timeout 3 --max-time 10 -sS "$app_url/config" > /dev/null || true
                    ;;
                  NO_APP_FILE|CONFIG_ERROR|BUILD_ERROR|RUNTIME_ERROR|DELETING|PAUSED)
                    echo "::error::Space reached terminal stage $stage at $runtime_sha. See https://huggingface.co/spaces/$HF_SPACE_ID"
                    exit 1
                    ;;
                esac
              fi
            fi
            sleep 5
          done

          echo "::error::Space did not serve $GITHUB_SHA within ~5 min; last seen stage=$stage sha=$runtime_sha"
          exit 1
