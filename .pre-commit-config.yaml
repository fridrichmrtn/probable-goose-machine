default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]

  - repo: local
    hooks:
      - id: requirements
        name: regenerate requirements.txt
        entry: uv export --locked --no-dev --no-hashes --no-emit-project --format requirements-txt --output-file requirements.txt
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|requirements\.txt)$
      - id: mypy
        name: mypy (src/gander, strict)
        entry: uv run mypy src/
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: pytest-deterministic
        name: pytest -m "not live and not e2e"
        entry: uv run pytest -m "not live and not e2e" --strict-markers -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
